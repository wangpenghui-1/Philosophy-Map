name: Quality gates

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run db:migrate:check
      - run: npm run backup:verify
      - run: npm run restore:drill
      - run: npm run deployment:check:plan
      - run: npx playwright install --with-deps chromium
      - run: npm run review:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release-evidence
          path: artifacts/production/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-review-report
          path: artifacts/review/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

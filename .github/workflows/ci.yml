name: Quality gates

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

jobs:
  core_review:
    name: core-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm run review:automated
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-release-evidence
          path: artifacts/production/
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automated-review-report
          path: artifacts/review/
          retention-days: 30

  browser_regression:
    name: browser-${{ matrix.project }}
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  dependency_review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  validate:
    name: validate
    if: always()
    needs: [core_review, browser_regression, dependency_review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce the complete quality gate
        env:
          CORE_RESULT: ${{ needs.core_review.result }}
          BROWSER_RESULT: ${{ needs.browser_regression.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency_review.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          test "$CORE_RESULT" = "success"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            test "$BROWSER_RESULT" = "skipped"
            test "$DEPENDENCY_RESULT" = "skipped"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            test "$BROWSER_RESULT" = "success"
            test "$DEPENDENCY_RESULT" = "success"
          else
            test "$BROWSER_RESULT" = "success"
            test "$DEPENDENCY_RESULT" = "skipped"
          fi
